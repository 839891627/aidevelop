spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      embedding:
        enabled: true
        embeddings-path: ${OPENAI_EMBEDDINGS_PATH:/embeddings}
        options:
          model: ${EMBEDDING_MODEL:doubao-embedding-vision}
      image:
        enabled: false
      audio:
        speech:
          enabled: false
        transcription:
          enabled: false
      chat:
        enabled: true
        completions-path: ${OPENAI_CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${OPENAI_CHAT_MODEL}
          temperature: 0.7
          max-tokens: 1000
