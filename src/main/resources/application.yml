spring:
  application:
    name: ai-chat-assistant
  profiles:
    active: openai
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  ai:
    retry:
      max-attempts: 3
      backoff-delay: 1000
    vectorstore:
      milvus:
        enabled: ${MILVUS_ENABLED:false}
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
        database-name: ${MILVUS_DATABASE:default}
        collection-name: ${MILVUS_COLLECTION:knowledge_vectors}
        embedding-dimension: ${MILVUS_EMBEDDING_DIMENSION:768}
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false
  use-fqn: true

knife4j:
  enable: true
  production: false
  basic:
    enable: false
  documents:
    - name: 项目说明
      locations: classpath:knife4j/project.md
  settings:
    language: zh_CN
    enable-swagger-models: true
    enable-document-manage: true
    swagger-models-name: 数据模型
    enable-host-text: false
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: "© 2026 AI Chat Assistant | 智能对话助手系统"
    enable-dynamic-modify-parameter: true
    enable-debug: true
    enable-open-api: true
    enable-filter-multipart-apis: true
    enable-filter-multipart-api-method-type: POST

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.aidevelop: DEBUG
    org.springframework.ai: DEBUG
    # LLM 交互链路日志（Spring AI -> OpenAI API -> HTTP Client）
    org.springframework.ai.chat.client: DEBUG
    org.springframework.ai.openai: DEBUG
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE
    reactor.netty.http.client: DEBUG
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/aidevelop.log
app:
  ai:
    pricing:
      chat-input: 0.001
      chat-output: 0.002
      embedding-input: 0.0
  chat:
    max-history-size: 10
    default-temperature: 0.7
    default-max-tokens: 1000
    rag:
      # false: 纯聊天模式，不走向量检索；true: 启用 RAG（会调用 embedding）
      enabled: true
      embedding-batch-size: ${RAG_EMBEDDING_BATCH_SIZE:10}
      similarity-threshold: 0.2
      top-k: 5
      chunking:
        chunk-size: 500
        min-chunk-size-chars: 200
        min-chunk-length-to-embed: 10
        max-num-chunks: 10000
        keep-separator: true
      pipeline:
        enable-query-rewrite: true
        enable-query-expansion: true
        enable-hybrid-search: false
        enable-rerank: true
        auto-mode: true
        complex-query-length: 10
        question-words:
          - 怎么办
          - 如何
          - 怎么
          - 为什么
          - 是什么
          - 哪些
          - 如何处理
    routing:
      business-id-pattern: "(LOAN\\d+|REPAY\\d+|CUST\\d+|ORDER\\d+)"
      tool-intent-keywords:
        - 查询订单
        - 订单
        - 借款记录
        - 还款记录
        - 风险评估
        - 用户编号
      rag-intent-keywords:
        - 规则
        - 政策
        - 产品手册
        - 利率
        - 额度
        - 期限
        - 申请条件
        - 流程
      tool-only-tool-names:
        - loanQueryFunction
        - repaymentQueryFunction
        - riskAssessmentFunction
      hybrid-tool-names:
        - loanQueryFunction
        - repaymentQueryFunction
        - riskAssessmentFunction
      rag-only-top-k: 5
      rag-only-similarity-threshold: 0.2
      hybrid-top-k: 3
      hybrid-similarity-threshold: 0.25
      max-tool-calls: 3
      timeout-ms: 30000
      multi-agent-keywords:
        - 综合评估
        - 多维度分析
        - 先查再评
    agent:
      enabled: true
      max-steps: 3
      timeout-ms: 15000
      tool-max-retries: 1
      retry-backoff-ms: 200
      reflect-enabled: true
      replan-enabled: true
      max-replan-rounds: 1
      force-rag-for-risk-evaluation: true
      risk-intent-keywords:
        - 风险
        - 风控
        - 评估
        - 判断
      require-rag-evidence-for-risk: true
      self-check-enabled: true
      self-check-min-score: 70
      min-observation-count: 1
      fallback-on-replan-failure: true
      fallback-when-self-check-failed: true
      fallback-answer-template: |
        基于当前可验证信息，我先给出稳健结论：
        - 问题：{question}
        - 路由：{routeType}
        - 证据：{observations}
        - 说明：{reason}
        如需更精确结果，请补充更多上下文或稍后重试。
      allowed-tools:
        - rag.search
        - loan.query
        - repayment.query
        - risk.assess
    multi-agent:
      enabled: true
      max-supervisor-rounds: 5
      supervisor-timeout-ms: 60000
      supervisor-system-prompt: |
        你是多 Agent 调度器。根据用户问题和已有结果决定下一步。
        仅返回 JSON：{"action":"DISPATCH","targetAgent":"<name>","reason":"..."} 或 {"action":"FINISH","reason":"..."}
        规则：
        1) 每次只 DISPATCH 一个 Agent
        2) 不要重复 DISPATCH 已完成的 Agent（除非结果不足）
        3) 所有必要信息收集完毕后输出 FINISH
      multi-agent-keywords:
        - 综合评估
        - 多维度分析
        - 先查再评
      require-multiple-intents: true
      agents:
        risk-agent:
          description: "风险评估专家，负责用户信用风险分析"
          system-prompt: |
            你是风险评估专家。基于借款数据和知识库规则，为用户提供风险分析。
            必须引用 RAG 证据支持结论。
          allowed-tools:
            - rag.search
            - risk.assess
          max-steps: 2
          reflect-enabled: true
          replan-enabled: false
          self-check-enabled: true
          temperature: 0.3
          max-tokens: 800
          output-key: risk_result
        loan-agent:
          description: "借款查询专家，负责贷款记录查询与解读"
          system-prompt: |
            你是借款查询助手。精确查询用户借款和还款记录并清晰呈现。
          allowed-tools:
            - loan.query
            - repayment.query
          max-steps: 2
          reflect-enabled: true
          replan-enabled: false
          self-check-enabled: false
          temperature: 0.5
          max-tokens: 600
          output-key: loan_result
        rag-agent:
          description: "知识检索专家，负责从规则政策库中检索相关信息"
          system-prompt: |
            你是金融产品知识专家。从知识库中精确检索规则和政策信息。
          allowed-tools:
            - rag.search
          max-steps: 1
          reflect-enabled: false
          replan-enabled: false
          self-check-enabled: false
          temperature: 0.2
          max-tokens: 500
          output-key: rag_result
      agent-as-tool:
        enabled: true
        tool-name: agent.delegate
        delegatable-agents:
          - risk-agent
          - loan-agent
          - rag-agent
  prompts:
    enabled: true
    registry-enabled: true
    env: dev
  tools:
    enabled:
      - loanQueryFunction
      - repaymentQueryFunction
      - riskAssessmentFunction
  cost-tracking:
    enabled: true
    log-all-calls: true
